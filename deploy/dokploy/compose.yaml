services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: ${API_IMAGE:?required immutable API image}
    restart: "no"
    command: [node, /app/node_modules/prisma/build/index.js, migrate, deploy]
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
  api:
    image: ${API_IMAGE:?required immutable API image}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:?required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      BETTER_AUTH_URL: ${WEB_ORIGIN:?required}
      WEB_ORIGIN: ${WEB_ORIGIN:?required}
    expose: ["3001"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [application, database]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  web:
    image: ${WEB_IMAGE:?required immutable Web image}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_ORIGIN: http://api:3001
      WEB_ORIGIN: ${WEB_ORIGIN:?required}
    expose: ["3000"]
    depends_on:
      api:
        condition: service_healthy
    networks: [application]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
networks:
  application: {}
  database:
    internal: true
volumes:
  postgres_data: {}
