name: Deploy production
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Approved existing release tag
        required: true
        type: string
      approve-production:
        description: Explicitly authorize deploying this release to production
        required: true
        default: false
        type: boolean
      initial-deployment:
        description: First deployment only; require verified absence of any prior production Compose deployment, database container or volume
        required: true
        default: false
        type: boolean
      backup-reference:
        description: Required for ordinary upgrades; empty for verified initial deployment or explicit v0.1.4 unbacked upgrade
        required: false
        type: string
      backup-verified-at:
        description: Required for ordinary upgrades; ISO timestamp of verification within 24 hours
        required: false
        type: string
      allow-unbacked-upgrade:
        description: Explicit exceptional upgrade of existing production to v0.1.4 without a verified backup (not initial deployment)
        required: true
        default: false
        type: boolean
      unbacked-upgrade-acknowledgement:
        description: If exception enabled, type exactly I ACCEPT PERMANENT DATA LOSS RISK FOR TOOLTRACK V0.1.4
        required: false
        type: string
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.approve-production
    environment: production
    concurrency:
      group: tooltrack-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked deployment dependencies
        run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release and original staging acceptance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: node deploy/scripts/prepare-production.mjs
      - name: Deploy the approved immutable images
        env:
          DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PRODUCTION_APPROVED: ${{ inputs.approve-production }}
          INITIAL_DEPLOYMENT: ${{ inputs.initial-deployment }}
          BACKUP_REFERENCE: ${{ inputs.backup-reference }}
          BACKUP_VERIFIED_AT: ${{ inputs.backup-verified-at }}
          ALLOW_UNBACKED_UPGRADE: ${{ inputs.allow-unbacked-upgrade }}
          UNBACKED_UPGRADE_ACKNOWLEDGEMENT: ${{ inputs.unbacked-upgrade-acknowledgement }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_PROJECT_ID: ${{ vars.DOKPLOY_PROJECT_ID }}
          DOKPLOY_ENVIRONMENT_ID: ${{ vars.DOKPLOY_ENVIRONMENT_ID }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_VERIFIER_IMAGE: ${{ vars.DOKPLOY_VERIFIER_IMAGE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_BASE_URL: ${{ vars.WEB_ORIGIN }}
        run: node deploy/scripts/dokploy-deploy.mjs release-manifest.json production
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-deployment
          path: deployment-record.json
          if-no-files-found: ignore
          retention-days: 90
