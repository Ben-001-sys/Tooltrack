name: CI
on:
  pull_request:
  push:
    branches: [staging, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate && pnpm prisma:validate
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: node --test deploy/tests/*.test.mjs
      - run: node deploy/scripts/architecture-check.mjs
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: tooltrack_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ci -d tooltrack_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:disposable-ci-only@127.0.0.1:5432/tooltrack_ci
      TEST_DATABASE_URL: postgresql://ci:disposable-ci-only@127.0.0.1:5432/tooltrack_ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate && pnpm db:deploy && pnpm db:status
      - run: pnpm build:api && pnpm --dir apps/api test:e2e
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
  images:
    needs: [quality, database, frontend]
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
    with:
      publish: false
  required:
    name: CI required
    if: always()
    needs: [quality, database, frontend, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(job=>job.result!=="success")) process.exit(1)'
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    needs: required
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true
  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: [required, publish]
    uses: ./.github/workflows/deploy-staging.yml
    permissions:
      contents: read
      packages: read
    with:
      web-image: ${{ needs.publish.outputs.web-image }}
      api-image: ${{ needs.publish.outputs.api-image }}
    secrets: inherit
